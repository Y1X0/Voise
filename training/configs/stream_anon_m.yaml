# StreamAnon-M: higher-capacity fallback if S under-fits (~11.0 M params, ~1.0 GMAC/s, 40 ms).
# Nothing here has been trained. See docs/STREAMING_NEURAL_TRAINING_PLAN.md.

model:
  sr: 16000
  hop: 160            # 10 ms
  win: 320            # 20 ms sqrt-Hann, analysis window ends at the current sample
  n_mels: 80
  enc_dim: 256
  enc_blocks: 6
  enc_kernel: 7
  enc_gru: true
  bottleneck_dim: 64
  vq_codes: 512       # VQ information bottleneck
  dec_dim: 384
  dec_blocks: 8
  dec_kernel: 7
  mlp_mult: 3
  spk_dim: 128        # pseudo-speaker vector (FiLM)
  prosody_emb: 32
  delay_frames: 2     # 20 ms learned look-ahead -> 40 ms algorithmic latency
  n_units: 500        # k-means units of the content teacher (training head)
  n_phones: 69        # CTC grapheme tokens EN+AR (datasets/ctc_targets.py n_tokens()), training head only
  n_speakers: 3000    # adversarial speaker classifier classes (training only)

data:
  train_manifest: data/manifests/train.jsonl
  valid_manifest: data/manifests/valid.jsonl
  segment_seconds: 2.0
  batch_size: 16
  num_workers: 8
  augment:
    noise_manifest: data/manifests/noise.jsonl     # MUSAN + DNS noise, SNR 0-30 dB
    rir_manifest: data/manifests/rir.jsonl         # OpenSLR-28 RIRs, p = 0.3
    codec_p: 0.2                                   # AMR-WB / Opus 16 kbit/s simulation
    gain_db: [-12, 6]
  teacher:
    units: data/teacher/units_k500.npy             # precomputed OFFLINE, see scripts/compute_teacher_units.py
    unit_teacher: whisper-small-encoder            # MIT (code + weights); training-time only, never shipped
                                                   # (docs/CONTENT_TEACHER_DECISION.md; mHuBERT-147 is CC-BY-NC-SA)
    content_model: student-stage1-encoder          # stage-3 content-output loss: frozen copy of the stage-1 encoder
  speaker_encoders_train:                          # role TRAIN: used INSIDE the losses; never used for evaluation
    - ecapa_train_inhouse                          # trained in-house on commercial-path train speakers (USER_DECISION U6)
    - resnet34_train_inhouse                       # (WeSpeaker VoxCeleb checkpoints: LICENSE_NOT_VERIFIED)
  f0: runtime_yin                                  # the app's C++ YIN, built as a Python extension

losses:   # initial weights; see docs/STREAMING_NEURAL_TRAINING_PLAN.md section 6
  mel_l1: 45.0
  mrstft: 1.0
  gan: 1.0
  feature_matching: 2.0
  unit_ce: 1.0
  ctc: 0.5
  vq_commit: 0.25
  speaker_adversarial: {max: 1.0, warmup_steps: 50000}
  speaker_suppression: {weight: 2.0, margin: 0.25}
  pseudo_consistency: 1.0
  anti_impersonation: {weight: 2.0, tau: auto}      # tau = p99 of unrelated-speaker similarity
  content_output: 10.0
  temporal_consistency: 0.5
  f0_follow: 1.0

optim:
  generator: {lr: 2.0e-4, betas: [0.8, 0.99], weight_decay: 0.01}
  discriminator: {lr: 2.0e-4, betas: [0.8, 0.99]}
  lr_decay: 0.999996      # per step
  grad_clip: 10.0
  precision: bf16

stages:
  - {name: content_distillation, steps: 200000, train: [encoder, unit_head, ctc_head, vq], losses: [unit_ce, ctc, vq_commit]}
  - {name: reconstruction, steps: 300000, train: [decoder, head, speaker_encoder_cond], losses: [mel_l1, mrstft, gan, feature_matching, f0_follow], conditioning: own_speaker}
  - {name: anonymization, steps: 200000, train: all, losses: all, conditioning: pseudo_speaker_mix_0.5}
  - {name: qat_int8, steps: 20000, train: all, losses: [mel_l1, mrstft, content_output, speaker_suppression]}

pseudo_speaker:
  pool_size: 10000
  dim: 128
  reject_similarity_to_any_train_speaker: auto     # > p99 of unrelated-speaker similarity -> reject
  min_density_quantile: 0.05                       # reject implausible (too atypical) voices
  per_session: true

evaluators:   # role separation, enforced by evaluation/validator.py (one model = one role)
  VALID:      # validation curves, early stopping, checkpoint + hyper-parameter selection
    asv: [ecapa_valid_inhouse]                     # trained on a speaker-disjoint commercial-path subset
    asr: whisper_base_valid                        # MIT; normalised by datasets/ctc_targets.normalize
  HELD_OUT:   # used ONCE by evaluation/final_eval.py on TEST speakers; never for any selection
    asv: [vpc2024_ecapa_eval, satools_resnet_eval] # Phase-3 evaluators (evaluation-only, never shipped)
    asr: whisper_small_eval
    attacker: semi_informed_ecapa                  # trained on processed attacker_train speech
