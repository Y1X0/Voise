name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  dsp:
    name: DSP engine (host tests, benchmark, evaluation) + Termux CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build DSP core and host tools
        run: |
          cmake -S dsp -B dsp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build dsp/build -j"$(nproc)"
      - name: DSP unit and scenario tests
        run: ./dsp/build/voiceanon_tests | tee dsp-tests.txt
      - name: Performance benchmark (host CPU)
        run: ./dsp/build/voiceanon_bench | tee bench.md
      - name: Synthetic speech evaluation (all presets)
        run: |
          for p in natural balanced strong; do ./dsp/build/voiceanon_eval --synthetic --direction up --preset "$p"; done | tee synthetic-eval.jsonl
      - name: Real speech evaluation (openly licensed recordings)
        run: scripts/eval_real_speech.sh | tee real-eval.md
      - name: Termux CLI tests
        run: bash termux/tests/test_cli.sh
      - name: Listening-test analysis self-test
        run: python3 tools/listening-test/test_analyze.py
      - name: Anonymization-evaluation helper self-tests (no model weights)
        run: |
          python3 -m pip install --quiet numpy soundfile
          python3 scripts/tests/test_eval_helpers.py
      - uses: actions/upload-artifact@v4
        with:
          name: dsp-reports
          path: |
            dsp-tests.txt
            bench.md
            synthetic-eval.jsonl
            real-eval.md
            eval-out/*.wav

  streaming-prototype:
    name: Streaming neural anonymizer prototype (graph tests only, untrained)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only dependencies
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet numpy soundfile librosa pyyaml onnx onnxscript onnxruntime
      - name: Architecture tests
        run: python training/tests/test_architecture.py
      - name: Fetch Stage-0 smoke data (librosa/data, pinned commit)
        run: |
          git clone -q https://github.com/librosa/data models/librosa-data
          git -C models/librosa-data checkout -q 38f4b06556fa0ff1acda5e677d8ba05d1bc0fff0
      - name: Readiness tests (metrics, leakage, abort, telemetry guard, resume)
        env:
          ORT_DISABLE_TELEMETRY: "1"
        run: python training/tests/test_readiness.py
      - name: Stage-0 smoke run (mechanics only, no scientific meaning)
        env:
          ORT_DISABLE_TELEMETRY: "1"
        run: python training/trainers/train.py --config training/configs/smoke.yaml --smoke --out runs/smoke

  android:
    name: Android APK + JVM unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleDebugAndroidTest testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: voice-anonymizer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unit-test-reports
          path: app/build/reports/tests/

  emulator:
    name: Emulator validation (Android 14 emulator - NOT a real device)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app + instrumentation APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Run device validation on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash scripts/device_validation.sh --skip-build --duration 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-validation
          path: validation-out/
